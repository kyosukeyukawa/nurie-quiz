*,*::before,*::after{box-sizing:border-box}

<style>
/* Layout: one-screen app. Map (sea) fills the left; a notebook-like panel on the right. Stacks on phones. */
:root{
  --sea:#d7e8f0; --sea-line:#c3dae5;
  --land:#ffffff; --line:#7f98a6; --dim:#e9eff2;
  --ink:#1d3240; --muted:#5b7181;
  --panel:#ffffff; --panel-line:#d9e4ea; --chip:#eef4f7;
  --hat:#ffcf2e; --hat-ink:#3a2c00;          /* 通学帽の黄色: 出題中の県 */
  --ok:#21915a; --ng:#d2463f;
  --r1:#86bfe6; --r2:#8fcd98; --r3:#f3a57e; --r4:#b6a1e2;
  --r5:#ee90a4; --r6:#d5bd5f; --r7:#72ccc2; --r8:#e79c55;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f202c; --sea-line:#183040;
  --land:#223745; --line:#56788c; --dim:#18293a;
  --ink:#e6eef3; --muted:#9db2bf;
  --panel:#142532; --panel-line:#26404f; --chip:#1d3343;
  --hat:#ffcf2e; --hat-ink:#2a2000;
  --ok:#4cc985; --ng:#f07068;
  --r1:#3f86b8; --r2:#4b9a58; --r3:#c46a43; --r4:#7c63b8;
  --r5:#b9566c; --r6:#a08a2c; --r7:#2f9a8f; --r8:#b56b25;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sea:#0f202c; --sea-line:#183040;
  --land:#223745; --line:#56788c; --dim:#18293a;
  --ink:#e6eef3; --muted:#9db2bf;
  --panel:#142532; --panel-line:#26404f; --chip:#1d3343;
  --hat:#ffcf2e; --hat-ink:#2a2000;
  --ok:#4cc985; --ng:#f07068;
  --r1:#3f86b8; --r2:#4b9a58; --r3:#c46a43; --r4:#7c63b8;
  --r5:#b9566c; --r6:#a08a2c; --r7:#2f9a8f; --r8:#b56b25;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--display);font-weight:500;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.mapwrap{position:relative;min-width:0;min-height:0;
  background-image:radial-gradient(var(--sea-line) 1px,transparent 1px);background-size:22px 22px}
svg#map{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);display:block;touch-action:manipulation}
.pref{fill:var(--land);stroke:var(--line);stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .35s}
.pref:hover{fill:var(--chip)}
.pref:focus{outline:none}
.pref:focus-visible{stroke:var(--ink);stroke-width:2.5}
.pref.off{fill:var(--dim);stroke:var(--sea-line);pointer-events:none}
.pref.done{fill:var(--rc)}
.pref.done:hover{fill:var(--rc);filter:brightness(1.06)}
.pref.target{fill:var(--hat);stroke:var(--ink);stroke-width:2;animation:pulse 1.2s ease-in-out infinite}
.pref.hint{animation:hint .5s ease-in-out 4;fill:var(--hat)}
.pref.wrong{fill:var(--ng);transition:none}
.pref.sel{stroke:var(--ink);stroke-width:2.5}
.zukan .pref:not(.off){fill:var(--rc)}
@keyframes pulse{50%{opacity:.6}}
@keyframes hint{50%{opacity:.25}}
.insetbox{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.insetlbl{fill:var(--muted);font-size:13px;font-family:var(--display);font-weight:700}

.panel{background:var(--panel);border-left:1px solid var(--panel-line);display:flex;flex-direction:column;gap:16px;padding:20px 20px 16px;overflow-y:auto;min-width:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel>*{flex-shrink:0}
.iconbtn{white-space:nowrap}
h1{margin:0;font-size:1.35rem;white-space:nowrap;font-weight:900;letter-spacing:.04em;text-wrap:balance}
.iconbtn{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:1px solid var(--panel-line);border-radius:999px;padding:4px 10px;cursor:pointer}
.iconbtn[aria-pressed="false"]{opacity:.55}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.modes button{font:inherit;font-weight:700;font-size:.95rem;border:0;border-radius:10px;padding:10px 4px;background:none;color:var(--muted);cursor:pointer}
.modes button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.label{font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.regions{display:flex;flex-wrap:wrap;gap:6px}
.regions button{font:inherit;font-size:.82rem;border:1.5px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.regions button .dot{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.regions button small{color:var(--muted);font-variant-numeric:tabular-nums}
.regions button[aria-pressed="true"]{border-color:var(--ink)}
button:focus-visible{outline:2.5px solid var(--hat);outline-offset:2px}

.card{border:2px solid var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:150px;position:relative}
.q{font-size:1.15rem;font-weight:700;line-height:1.9;margin:0}
.q .big{font-size:1.9rem;font-weight:900;letter-spacing:.02em}
ruby rt{font-size:.42em;font-weight:700;color:var(--muted);letter-spacing:.08em}
.say{align-self:flex-start;font:inherit;font-weight:700;font-size:.85rem;background:var(--hat);color:var(--hat-ink);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button{font:inherit;font-size:1.05rem;font-weight:700;padding:12px 6px;border-radius:12px;border:2px solid var(--panel-line);background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.6}
.choices button:hover{border-color:var(--ink)}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.ng{border-color:var(--ng);color:var(--ng);opacity:.6}
.choices button ruby rt{color:inherit;opacity:.7}
.fb{min-height:1.6em;margin:0;font-weight:700;font-size:1.05rem}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.98rem}
.facts dt{color:var(--muted);font-size:.8rem;padding-top:3px}
.facts dd{margin:0;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:10px 16px;border:0;background:var(--ink);color:var(--panel);cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--panel-line);font-size:.85rem;padding:6px 12px}
.btn.danger{background:var(--ng);color:#fff;font-size:.85rem;padding:6px 12px}
.progress{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.bar{height:12px;border-radius:999px;background:var(--chip);overflow:hidden;display:flex}
.bar span{height:100%;background:var(--rc);transition:width .4s}
.ptext{font-size:.9rem;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ptext b{font-size:1.2rem}
.stamp{position:absolute;right:14px;top:-14px;background:var(--ok);color:#fff;font-weight:900;border-radius:999px;padding:4px 12px;font-size:.9rem;transform:rotate(4deg)}
/* タブレット：指で押しやすく、長押しで文字選択されないように */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,.pref{touch-action:manipulation}
@media (pointer:coarse){
  .modes button{padding:14px 4px;font-size:1.05rem}
  .regions button{padding:9px 14px 9px 11px;font-size:.95rem}
  .choices button{padding:16px 6px;font-size:1.2rem;min-height:64px}
  .say,.btn.ghost{padding:10px 16px;font-size:.95rem}
  .iconbtn{padding:8px 14px;font-size:.9rem}
}
/* 横向きタブレット：右のパネルを少し広く */
@media (min-width:1000px) and (pointer:coarse){ .app{grid-template-columns:minmax(0,1fr) 400px} }
/* 縦向き（タブレット縦・スマホ）：地図が上、パネルが下 */
@media (max-width:760px),(orientation:portrait) and (max-width:1100px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,56fr) minmax(0,44fr);height:100%}
  .panel{border-left:0;border-top:1px solid var(--panel-line);padding:16px}
  .q .big{font-size:1.6rem}
}
@media (orientation:portrait) and (min-width:600px) and (max-width:1100px){
  /* 縦向きタブレットはパネルを2列にして地図を大きく残す */
  .panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;column-gap:24px}
  .panel>.brand,.panel>.modes{grid-column:1/-1}
  .panel>.card{grid-column:2;grid-row:3 / span 2}
  .progress{margin-top:0}
}
@media (max-width:599px){
  .app{height:auto;min-height:100%;grid-template-rows:auto auto}
  .mapwrap{height:min(58svh,100vw)}
}
.fsbtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.pref,.bar span{transition:none}.pref.target,.pref.hint{animation:none}}
</style>

</div>

let ac=null;
function chime(ok){
  if(!S.sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[784,1047,1319]:[330,262];
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime+i*.11;
      o.type=ok?"triangle":"sine";o.frequency.value=f;
      v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.18,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+.35);

}

    b.innerHTML=(r?`<span class="dot" style="--rc:var(--r${r})"></span>`:"")+`${label}<small>${n}/${ids.length}</small>`;

    box.appendChild(b);

  mk(0,"ぜんこく");
  for(let r=1;r<=8;r++) mk(r,REGIONS[r][1]);

    $("#noBtn").onclick=()=>{S.confirm=false;renderReset()};
    $("#yesBtn").onclick=()=>{regionIds().forEach(i=>S.colored.delete(i));save();S.confirm=false;S.cur=null;next()};
  }else{
    row.innerHTML=`<button class="btn ghost" id="resetBtn">${label} いろを けす</button>`;
    $("#resetBtn").onclick=()=>{S.confirm=true;renderReset()};
    $("#resetBtn").disabled=!regionIds().some(i=>S.colored.has(i));
  }
}
const save=()=>store.set("nurie.colored",[...S.colored]);

// ---- zoom to region
let vb=[0,0,800,800], anim=null;
function zoom(){
  let t=[0,0,800,800];
  if(S.region){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    regionIds().forEach(i=>{const b=MB[i];x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])});
    const w=x1-x0,h=y1-y0,s=Math.max(w,h,140)*1.15;
    t=[(x0+x1)/2-s/2,(y0+y1)/2-s/2,s,s];
  }
  const from=vb.slice(), reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  cancelAnimationFrame(anim);
  if(reduce){vb=t;svg.setAttribute("viewBox",t.join(" "));return}
  const st=performance.now(),D=500;
  const step=now=>{let k=Math.min(1,(now-st)/D);k=1-Math.pow(1-k,3);
    vb=from.map((v,i)=>v+(t[i]-v)*k);svg.setAttribute("viewBox",vb.join(" "));
    if(k<1) anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}

// ---- question flow
function next(){
  S.miss=0;S.busy=false;
  if(S.mode==="zukan"){renderZukan();paint();return}
  const pool=regionIds().filter(i=>!S.colored.has(i));
  if(!pool.length){S.cur=null;renderDone();paint();return}
  let c=pool.filter(i=>i!==S.last); if(!c.length)c=pool;
  S.cur=c[Math.random()*c.length|0]; S.last=S.cur;
  S.mode==="find"?renderFind():renderName();
  paint();
}
function sayBtn(text){return canSpeak?`<button class="say" data-say="${text}">よみあげ</button>`:""}
function bindSay(){card.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say))}

function renderFind(){
  const p=P[S.cur];
  card.innerHTML=`<p class="q"><span class="big">${ruby(p)}</span><br>は どこかな？ ちずを タッチしてね</p>
    ${sayBtn(p.kana+" は どこかな")}<p class="fb" id="fb"></p>
    <div class="row"><button class="btn ghost" id="hintBtn">ヒント</button><button class="btn ghost" id="skipBtn">つぎへ</button></div>`;
  bindSay();
  $("#hintBtn").onclick=()=>hint();
  $("#skipBtn").onclick=()=>next();
}
function renderName(){
  const p=P[S.cur];
  let others=regionIds().filter(i=>i!==S.cur);
  if(others.length<3) others=others.concat(DATA.map(d=>d[0]).filter(i=>i!==S.cur&&!others.includes(i)&&Math.abs(P[i].reg-p.reg)<=1));
  const opts=shuffle([S.cur,...shuffle(others).slice(0,3)]);
  card.innerHTML=`<p class="q">きいろい ところは<br><span class="big">なにけん？</span></p>
    <div class="choices">${opts.map(i=>`<button data-id="${i}">${ruby(P[i])}</button>`).join("")}</div>
    <p class="fb" id="fb"></p>`;
  card.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>answerName(b));
}
function renderDone(){
  const label=S.region?REGIONS[S.region][1]+"の けん":"47の とどうふけん";
  card.innerHTML=`<span class="stamp">ぜんぶ ぬれた！</span>
    <p class="q"><span class="big">すごい！</span><br>${label}を ぜんぶ いろぬり できたね。</p>
    <p class="fb">べつの ちほうに ちょうせんするか、いろを けして もういちど。</p>`;
  chime(true);
}
function renderZukan(){
  if(!S.sel){
    card.innerHTML=`<p class="q"><span class="big">ずかん</span><br>ちずの けんを タッチすると、けんちょうしょざいちや たべものが でてくるよ。</p>`;
    return;
  }
  const p=P[S.sel];
  card.innerHTML=`<p class="q" style="margin:0"><span class="big">${ruby(p)}</span></p>
    <dl class="facts">
      <dt>ちほう</dt><dd><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--r${p.reg});margin-right:6px"></span>${REGIONS[p.reg][0]}<small style="color:var(--muted);font-weight:500">（${REGIONS[p.reg][1]}）</small></dd>
      <dt>けんちょう</dt><dd><ruby>${p.cap}<rt>${p.capKana}</rt></ruby></dd>
      <dt>たべもの</dt><dd>${p.food}</dd>
    </dl>
    ${sayBtn(`${p.kana}。けんちょうは ${p.capKana}。たべものは ${p.food}`)}`;
  bindSay();
}

function fb(text,cls){const f=$("#fb");if(f){f.textContent=text;f.className="fb "+(cls||"")}}
function correct(){
  S.busy=true;S.colored.add(S.cur);save();
  els[S.cur].classList.remove("target","hint");els[S.cur].classList.add("done");
  chime(true);
  const msgs=["せいかい！","やったね！","すごい！","ぴんぽーん！"];
  fb(msgs[Math.random()*msgs.length|0]+" "+P[S.cur].name+" に いろが ついたよ","ok");
  setTimeout(next,1100);
}
function hint(){const e=els[S.cur];e.classList.remove("hint");void e.getBBox();e.classList.add("hint")}

function tap(id){
  if(!inRegion(id)) return;
  if(S.mode==="zukan"){S.sel=id;renderZukan();paint();return}
  if(S.mode!=="find"||S.busy||!S.cur) return;
  if(id===S.cur){correct();return}
  S.miss++;chime(false);
  const e=els[id];e.classList.add("wrong");setTimeout(()=>e.classList.remove("wrong"),450);
  fb(`そこは ${P[id].kana} だよ`,"ng");
  if(S.miss>=2) hint();
}
function answerName(b){
  if(S.busy) return;
  const id=+b.dataset.id;
  if(id===S.cur){b.classList.add("ok");correct()}
  else{b.classList.add("ng");b.disabled=true;S.miss++;chime(false);fb("おしい！ もういちど","ng")}
}

g.addEventListener("click",e=>{const id=e.target.dataset&&e.target.dataset.id;if(id)tap(+id)});
g.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset.id){e.preventDefault();tap(+e.target.dataset.id)}});
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".modes button").forEach(x=>x.setAttribute("aria-selected",x===b));
  S.mode=b.dataset.mode;S.cur=null;S.confirm=false;next();
});
const sb=$("#soundBtn");sb.setAttribute("aria-pressed",S.sound);
sb.onclick=()=>{S.sound=!S.sound;store.set("nurie.sound",S.sound);sb.setAttribute("aria-pressed",S.sound)};

// 全画面（対応している端末だけボタンを出す）
const fsb=$("#fsBtn"), root=document.documentElement;
const reqFS=root.requestFullscreen||root.webkitRequestFullscreen;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone&&reqFS&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){
  fsb.hidden=false;
  fsb.onclick=()=>{
    const on=document.fullscreenElement||document.webkitFullscreenElement;
    try{ const r=on?(document.exitFullscreen||document.webkitExitFullscreen).call(document):reqFS.call(root); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
  };
  const upd=()=>fsb.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?"もどす":"ぜんがめん";
  document.addEventListener("fullscreenchange",upd);document.addEventListener("webkitfullscreenchange",upd);
}

next();
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
